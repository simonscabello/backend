name: louvor_app
description: Escalas de louvor - app da equipe
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado + injecao de dependencia
  flutter_riverpod: ^2.5.1
  # Navegacao com guarda de rota por estado de autenticacao
  go_router: ^14.2.0
  # HTTP
  dio: ^5.5.0
  # Tokens (etapa 1)
  flutter_secure_storage: ^9.2.2
  # Equipe ativa / cache do ultimo estado
  shared_preferences: ^2.3.0
  # Datas em pt_BR. A versao e fixada pelo flutter_localizations do SDK.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
